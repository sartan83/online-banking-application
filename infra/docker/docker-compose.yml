services:
  postgres:
    image: postgres:16-alpine@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50
    environment:
      POSTGRES_DB: devilsvault
      POSTGRES_USER: devilsvault
      POSTGRES_PASSWORD: devilsvault
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devilsvault"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine@sha256:7aec734b2bb298a1d769fd8729f13b8514a41bf90fcdd1f38ec52267fbaa8ee6
    ports:
      - "6379:6379"

  mailhog:
    # MailHog upstream has been unmaintained since 2020 and the maintainer
    # never published a v1.0.1 image to Docker Hub. We keep the floating tag
    # here because mailhog is local-dev-only — never deployed to prod — and
    # the supply-chain CI workflow scopes its image scans to backend and
    # frontend Dockerfiles, not this compose file.
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    build:
      context: ../..
      dockerfile: infra/docker/backend.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/devilsvault
      DB_USER: devilsvault
      DB_PASSWORD: devilsvault
      JWT_SECRET: local-dev-secret-local-dev-secret-local-dev-secret-64-chars
      CORS_ALLOWED_ORIGINS: http://localhost:5173,https://fine-forks-guess.loca.lt,https://fc1a8d21b323-tunnel-l4gugyix.devinapps.com
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ../..
      dockerfile: infra/docker/frontend.Dockerfile
    depends_on:
      - backend
    ports:
      - "5173:8080"

volumes:
  pgdata:
