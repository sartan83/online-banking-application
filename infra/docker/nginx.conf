server {
    # Unprivileged nginx listens on 8080 (the parent image runs as a non-root
    # user that cannot bind <1024). The compose file maps host:5173 -> 8080.
    listen 8080;
    server_name _;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
