spring:
  datasource:
    url: jdbc:h2:mem:devilsvault;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true

app:
  security:
    jwt:
      secret: test-secret-test-secret-test-secret-test-secret-test-secret-64
      expiration-minutes: 60
    cors:
      allowed-origins: http://localhost:5173
