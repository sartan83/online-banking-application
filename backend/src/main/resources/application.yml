spring:
  application:
    name: devilsvault-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/devilsvault}
    username: ${DB_USER:devilsvault}
    password: ${DB_PASSWORD:devilsvault}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

app:
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-change-me-64}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
      # RS256 key pair for JWT signing. If not set, ephemeral keys are generated (dev only).
      private-key-pem: ${JWT_PRIVATE_KEY_PEM:#{null}}
      public-key-pem: ${JWT_PUBLIC_KEY_PEM:#{null}}
      kid: ${JWT_KID:#{null}}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
